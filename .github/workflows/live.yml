name: Hall Pass live verification
on:
  push:
    branches: ['verify/hall-pass-production-2026-11-11']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tooling
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Verify actual production and live flows
        run: node tests/live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hall-pass-live-verification
          path: test-results/
